<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAI 生图测试面板</title>
  <link rel="stylesheet" href="./style.css?v=2026102105" />
</head>
<body>
  <div class="container">
    <header class="top-header glass-card">
      <div class="brand">
        <div class="brand-badge">NAI</div>
        <div>
          <h1>NAI 生图测试面板</h1>
          <p class="subtitle" id="headerSub">NovelAI V4.5 / V5 绘图工作台 · 多槽位（名称 / 模型 / 画师串）联动与专属词库同步</p>
        </div>
      </div>
      <div class="header-actions">
        <span id="connBadge" class="conn-pill">正在连接…</span>
        <button id="btnRefresh" class="btn btn-ghost" type="button">↻ 刷新配置</button>
      </div>
    </header>

    <div class="main-grid">
      <!-- 左栏：多槽位画师串配置 + 提示词输入 + 按模型同步的 Tag 词库 -->
      <section class="left-col">
        <!-- 1. 画师串与模型预设槽位（自定义名称 + 绑定模型 + 画师串） -->
        <div class="glass-card panel-box">
          <div class="panel-head">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
              <h2>预设槽位管理（自定义名称 · 绑定模型 · 画师串）</h2>
              <span id="activeSlotBadge" class="tag-pill" style="color:#58a6ff;border:1px solid #1f6feb;">UI 测试中：槽位 1</span>
              <span id="backendSlotBadge" class="tag-pill" title="平时聊天生图所使用的槽位，请在插件【配置】弹窗中选择">后端正式槽位：槽位 1</span>
            </div>
            <div class="head-btns">
              <button id="btnAddSlot" class="btn btn-sm btn-accent" type="button">+ 新建槽位</button>
              <button id="btnDeleteSlot" class="btn btn-sm btn-ghost" type="button">删除槽位</button>
              <button id="btnSaveSlot" class="btn btn-sm btn-primary" type="button">💾 保存槽位列表（同步至后端选项）</button>
            </div>
          </div>

          <!-- 槽位切换选项卡栏 -->
          <div id="slotTabs" class="slot-tabs"></div>

          <!-- 当前槽位的三合一编辑区：自定义名称 + 绑定模型 + 画师串 -->
          <div class="slot-editor-grid">
            <div class="param-item">
              <label>1. 槽位自定义名称</label>
              <input id="inpSlotName" type="text" placeholder="例如：V4.5 水润写实主力 / V5 厚涂光影…" />
            </div>
            <div class="param-item">
              <label>2. 槽位绑定生图模型（切换自动同步词库）</label>
              <select id="selModel">
                <option value="nai-diffusion-4-5-full">NAI Diffusion V4.5 Full</option>
                <option value="nai-diffusion-4-5-curated">NAI Diffusion V4.5 Curated</option>
                <option value="nai-diffusion-5-full">NAI Diffusion V5 Full</option>
                <option value="nai-diffusion-5-curated">NAI Diffusion V5 Curated</option>
                <option value="nai-diffusion-4-full">NAI Diffusion V4 Full</option>
                <option value="nai-diffusion-3">NAI Diffusion V3</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label>3. 槽位专属画师串 (Custom Artists)</label>
            <textarea id="inpArtists" rows="3" placeholder="输入该槽位绑定的专属画师串前缀…"></textarea>
          </div>
        </div>

        <!-- 2. 提示词与生成参数 -->
        <div class="glass-card panel-box">
          <div class="panel-head">
            <div style="display:flex;align-items:center;gap:10px;">
              <h2>提示词与生成参数</h2>
              <span id="activeModelBadge" class="tag-pill">模型组：NAI V4.5</span>
            </div>
            <div class="head-btns">
              <button id="btnClearPrompt" class="btn btn-sm btn-ghost" type="button">清空提示词</button>
            </div>
          </div>

          <div class="field">
            <label id="lblNaiPrompt">正向提示词 (按模型组独立记忆 · 支持权重 1.2::tag:: 及【法典:词条名】)</label>
            <textarea id="naiPrompt" rows="4" placeholder="例如：1girl, solo, masterpiece, looking at viewer, smile, detailed background..."></textarea>
          </div>

          <div class="field" style="margin-top:4px;">
            <label>自然语言描述（可选，开启转译后将由 LLM 转换为英文 Tag 并合并）</label>
            <input id="nlPrompt" type="text" placeholder="输入中文或英文自然语言画面描述…" />
          </div>

          <div class="param-bar">
            <div class="param-item">
              <label>画幅尺寸</label>
              <select id="selSize">
                <option value="832x1216">竖图 832×1216</option>
                <option value="1216x832">横图 1216×832</option>
                <option value="1024x1024">方图 1024×1024</option>
                <option value="1024x1536">大图竖向 1024×1536</option>
                <option value="1536x1024">大图横向 1536×1024</option>
              </select>
            </div>
            <div class="param-item">
              <label>画风策略</label>
              <select id="selStyle">
                <option value="custom">使用当前槽位画师串</option>
                <option value="vertical">内置：韩漫小清新风</option>
                <option value="r18">内置：2.5D 唯美风</option>
                <option value="comicDoujin">内置：漫画同人风</option>
                <option value="galgame">内置：GalGame CG风</option>
                <option value="anime">内置：赛璐璐动画风</option>
              </select>
            </div>
            <div class="param-item small">
              <label>Steps</label>
              <input id="inpSteps" type="number" min="1" max="50" value="24" />
            </div>
            <div class="param-item small">
              <label>Scale</label>
              <input id="inpScale" type="number" step="0.5" min="1" max="15" value="6" />
            </div>
            <div class="param-item small">
              <label>采样器</label>
              <select id="selSampler">
                <option value="k_dpmpp_2m_sde">dpm++ 2m sde</option>
                <option value="k_euler_ancestral">euler_a</option>
                <option value="k_dpmpp_2s_ancestral">dpm++ 2s_a</option>
                <option value="k_dpmpp_sde">dpm++ sde</option>
              </select>
            </div>
          </div>

          <div class="gen-action-row">
            <button id="btnGenerate" class="btn btn-primary btn-lg" type="button">立即测试生图（仅使用当前 UI 面板所选槽位与参数，不影响后端正式设置）</button>
          </div>
        </div>

        <!-- 3. 按模型自动同步的 Tag 词库检索 -->
        <div class="glass-card panel-box">
          <div class="panel-head">
            <h2 id="titleGrimBox">NAI V4.5 专属 Tag 词库（共 18,505 条）</h2>
            <span class="tag-pill" id="grimCountBadge">词库就绪</span>
          </div>
          <div class="grim-search-bar">
            <select id="grimScope" class="grim-scope"></select>
            <input id="grimQuery" type="text" placeholder="输入关键词搜索当前模型词库（留空点击搜索可浏览默认推荐）…" />
            <button id="btnGrimSearch" class="btn btn-accent" type="button">搜索</button>
          </div>
          <div class="grim-quick-tags" id="grimQuickTags"></div>
          <div id="grimResults" class="grim-results"></div>
        </div>
      </section>

      <!-- 右栏：生成结果预览 -->
      <section class="right-col">
        <div class="glass-card panel-box showcase-panel">
          <div class="panel-head">
            <h2>生成结果预览</h2>
            <span id="genTimer" class="tag-pill">就绪</span>
          </div>

          <div id="canvasBox" class="canvas-box">
            <div class="canvas-empty" id="canvasEmpty">
              <div class="empty-icon">IMG</div>
              <p>填写提示词后点击「立即生成图片」查看结果</p>
              <span>支持一键下载原图与复制最终合成提示词</span>
            </div>
            <img id="resultImg" class="result-img hidden" alt="Generated Image" />
          </div>

          <div id="resultActions" class="result-actions hidden">
            <a id="btnDownloadImg" class="btn btn-accent" download="nai_output.png">下载原图</a>
            <button id="btnCopyFinalPrompt" class="btn btn-ghost" type="button">复制最终合成提示词</button>
          </div>

          <div class="final-prompt-box">
            <div class="preview-sub">实际发送的完整提示词：</div>
            <pre id="finalPromptPre" class="prompt-pre">暂无记录</pre>
          </div>
        </div>
      </section>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="./app.js?v=2026102105"></script>
</body>
</html>
